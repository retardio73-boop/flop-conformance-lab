name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Reproduce downstream Sentinel TCLK drift
        run: python3 conformance/reproductions/noobna-flop-sentinel-tclk.py
      - name: Reproduce downstream Sentinel Sonnet receipt trust gap
        run: python3 conformance/reproductions/noobna-sonnet-receipt-auth.py

  upstream-tclk-96:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flop-labs/tclk
          ref: 5cc4ab93efbc8999a3a7e1471b639deca25998ea
          path: upstream-tclk
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - name: Install pinned upstream
        working-directory: upstream-tclk
        run: pnpm install --frozen-lockfile
      - name: Build pinned upstream and MCP
        working-directory: upstream-tclk
        run: pnpm build:all
      - name: Reproduce TCLK #96 against pinned upstream
        env:
          TCLK_UPSTREAM_ROOT: ${{ github.workspace }}/upstream-tclk
        run: node conformance/reproductions/tclk-96-upstream.mjs

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: consumer
        uses: ./
        with:
          profile: technocore-agent
          input: examples/external-consumer/technocore-agent.json
          out: conformance-report.json
      - name: Assert portable result
        run: |
          test -f conformance-report.json
          node -e 'const r=require("./conformance-report.json"); if(!["PASS","PARTIAL"].includes(r.result)) process.exit(2)'
      - name: Upload retained evidence
        uses: actions/upload-artifact@v4
        with:
          name: action-smoke-conformance-report
          path: conformance-report.json
