name: FLOP Conformance

description: Run a portable FLOP Conformance Lab profile against repository-supplied evidence.

inputs:
  profile:
    description: External profile name (tclk-transcript or technocore-agent)
    required: true
  input:
    description: JSON input path relative to the caller repository
    required: true
  out:
    description: Result JSON path relative to the caller repository
    required: false
    default: conformance-report.json

outputs:
  result:
    description: Portable conformance result (PASS, PARTIAL, or FAIL)
    value: ${{ steps.result.outputs.result }}
  report:
    description: Absolute path to the generated conformance report
    value: ${{ steps.result.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Build FLOP Conformance Lab
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --ignore-scripts
        npm run build
    - name: Verify external evidence
      shell: bash
      run: |
        node "${{ github.action_path }}/dist/src/cli.js" verify \
          --profile "${{ inputs.profile }}" \
          --input "${{ github.workspace }}/${{ inputs.input }}" \
          --out "${{ github.workspace }}/${{ inputs.out }}"
    - name: Export portable result
      id: result
      shell: bash
      run: |
        REPORT="${{ github.workspace }}/${{ inputs.out }}"
        RESULT="$(node -e 'const fs=require("node:fs");const p=process.argv[1];const j=JSON.parse(fs.readFileSync(p,"utf8"));if(!["PASS","PARTIAL","FAIL"].includes(j.result))process.exit(2);process.stdout.write(j.result)' "$REPORT")"
        echo "result=$RESULT" >> "$GITHUB_OUTPUT"
        echo "report=$REPORT" >> "$GITHUB_OUTPUT"
